<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EcomDB — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --bg2: #111118; --bg3: #18181f;
      --border: #2a2a35; --accent: #7c6af7; --accent2: #a594f9;
      --text: #e8e8f0; --text2: #9090a8; --text3: #5a5a70;
      --success: #4ade80; --danger: #f87171;
      --purple: rgba(124,106,247,0.15); --teal: rgba(45,212,191,0.15); --coral: rgba(251,113,133,0.15);
      --font: 'IBM Plex Sans Arabic', sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .page { width: 100%; max-width: 420px; padding: 24px; }

    .logo { text-align: center; margin-bottom: 40px; }
    .logo-icon { font-size: 36px; color: var(--accent); display: block; margin-bottom: 8px; }
    .logo-text { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    .logo-sub { font-size: 13px; color: var(--text3); margin-top: 4px; font-family: var(--mono); }

    .role-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
    .role-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 10px; text-align: center;
      cursor: pointer; transition: all 0.2s;
    }
    .role-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .role-card.selected { border-color: var(--accent); background: var(--purple); }
    .role-card[data-role="admin"].selected  { background: rgba(124,106,247,0.12); border-color: #7c6af7; }
    .role-card[data-role="owner"].selected  { background: rgba(45,212,191,0.12);  border-color: #2dd4bf; }
    .role-card[data-role="customer"].selected { background: rgba(251,113,133,0.12); border-color: #fb7185; }
    .role-icon { font-size: 22px; margin-bottom: 6px; display: block; }
    .role-name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); }

    .form-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .form-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text2); }

    input {
      width: 100%; background: var(--bg3); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px; color: var(--text);
      font-family: var(--font); font-size: 14px; outline: none;
      transition: border-color 0.2s; margin-bottom: 10px; display: block;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--text3); }

    .btn-login {
      width: 100%; background: var(--accent); border: none; border-radius: 8px;
      padding: 12px; color: #fff; font-family: var(--font); font-size: 15px;
      font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 4px;
    }
    .btn-login:hover { background: var(--accent2); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 10px; min-height: 20px; }
    .error-msg.success { color: var(--success); }
    .form-switch { margin-top: 14px; text-align: center; color: var(--text3); font-size: 13px; }
    .link-btn { background: none; border: none; color: var(--accent2); font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0 2px; }
    .link-btn:hover { text-decoration: underline; }
    .signup-only-note { display: none; color: var(--text3); font-size: 12px; margin-bottom: 10px; line-height: 1.5; }

    .hint { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-top: 16px; font-size: 12px; color: var(--text3); font-family: var(--mono); line-height: 1.8; }
    .hint strong { color: var(--text2); }
  </style>
</head>
<body>
<div class="page">
  <div class="logo">
    <span class="logo-icon">⬡</span>
    <div class="logo-text">EcomDB</div>
    <div class="logo-sub">E-Commerce Database System</div>
  </div>

  <div class="role-grid">
    <div class="role-card" data-role="admin" onclick="selectRole('admin')">
      <span class="role-icon">◆</span>
      <div class="role-name">Admin</div>
    </div>
    <div class="role-card" data-role="owner" onclick="selectRole('owner')">
      <span class="role-icon">◫</span>
      <div class="role-name">Owner</div>
    </div>
    <div class="role-card selected" data-role="customer" onclick="selectRole('customer')">
      <span class="role-icon">◎</span>
      <div class="role-name">Customer</div>
    </div>
  </div>

  <div class="form-card">
    <div class="form-title" id="formTitle">Customer Login</div>
    <div class="signup-only-note" id="signupNote">Sign up is available for customers and owners.</div>

    <div id="adminFields" style="display:none">
      <input type="number" id="adminId" placeholder="Admin ID" />
      <input type="password" id="adminPass" placeholder="Password" />
    </div>

    <div id="ownerFields" style="display:none">
      <input type="text" id="ownerUsername" placeholder="Username" />
      <input type="password" id="ownerPass" placeholder="Password" />
    </div>

    <div id="customerFields">
      <input type="text" id="custUsername" placeholder="Username" />
      <input type="password" id="custPass" placeholder="Password" />
    </div>

    <div id="signupCustomerFields" style="display:none">
      <input type="text" id="signupCustUsername" placeholder="Username" />
      <input type="email" id="signupCustEmail" placeholder="Email" />
      <input type="password" id="signupCustPass" placeholder="Password" />
      <input type="password" id="signupCustConfirm" placeholder="Confirm password" />
      <input type="tel" id="signupCustPhone" placeholder="Phone number" />
      <input type="text" id="signupCustAddress" placeholder="Address" />
      <input type="text" id="signupCustBio" placeholder="Bio (optional)" />
    </div>

    <div id="signupOwnerFields" style="display:none">
      <input type="text" id="signupOwnerUsername" placeholder="Username" />
      <input type="email" id="signupOwnerEmail" placeholder="Email" />
      <input type="tel" id="signupOwnerPhone" placeholder="Phone number" />
      <input type="text" id="signupStoreName" placeholder="Store name" />
      <input type="password" id="signupOwnerPass" placeholder="Password" />
      <input type="password" id="signupOwnerConfirm" placeholder="Confirm password" />
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">Login</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-switch">
      <span id="switchText">Need an account?</span>
      <button class="link-btn" type="button" onclick="toggleMode()" id="switchBtn">Sign Up</button>
    </div>
  </div>

  <div class="hint">
    <strong>Test credentials:</strong><br>
    Admin ID: 1 · Pass: Admin@2024!<br>
    Owner: sarah_ahmed · Pass: Sarah@123<br>
    Customer: layla_mohammed · Pass: Layla@2024!
  </div>
</div>

<script>
const API = "http://localhost:5000";
let currentRole = "customer";
let authMode = "login";

function selectRole(role) {
  if (authMode === "signup" && role === "admin") role = "customer";
  currentRole = role;
  document.querySelectorAll(".role-card").forEach(c => c.classList.remove("selected"));
  document.querySelector(`[data-role="${role}"]`).classList.add("selected");

  document.getElementById("adminFields").style.display    = authMode === "login" && role === "admin"    ? "block" : "none";
  document.getElementById("ownerFields").style.display    = authMode === "login" && role === "owner"    ? "block" : "none";
  document.getElementById("customerFields").style.display = authMode === "login" && role === "customer" ? "block" : "none";
  document.getElementById("signupCustomerFields").style.display = authMode === "signup" && role === "customer" ? "block" : "none";
  document.getElementById("signupOwnerFields").style.display    = authMode === "signup" && role === "owner"    ? "block" : "none";

  const titles = {
    login: { admin: "Admin Login", owner: "Owner Login", customer: "Customer Login" },
    signup: { owner: "Owner Sign Up", customer: "Customer Sign Up" }
  };
  document.getElementById("formTitle").textContent = titles[authMode][role];
  document.getElementById("loginBtn").textContent = authMode === "login" ? "Login" : "Create Account";
  document.getElementById("signupNote").style.display = authMode === "signup" ? "block" : "none";
  document.getElementById("errorMsg").textContent = "";
  document.getElementById("errorMsg").classList.remove("success");
}

function toggleMode() {
  authMode = authMode === "login" ? "signup" : "login";
  document.querySelector('[data-role="admin"]').style.display = authMode === "signup" ? "none" : "block";
  document.getElementById("switchText").textContent = authMode === "login" ? "Need an account?" : "Already have an account?";
  document.getElementById("switchBtn").textContent = authMode === "login" ? "Sign Up" : "Login";
  if (authMode === "signup" && currentRole === "admin") currentRole = "customer";
  selectRole(currentRole);
}

async function doLogin() {
  if (authMode === "signup") return doRegister();
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("errorMsg");
  btn.disabled = true;
  err.textContent = "";
  err.classList.remove("success");

  try {
    let body = {};
    if (currentRole === "admin") {
      body = { role: "admin", id: +document.getElementById("adminId").value, password: document.getElementById("adminPass").value };
    } else if (currentRole === "owner") {
      body = { role: "owner", username: document.getElementById("ownerUsername").value, password: document.getElementById("ownerPass").value };
    } else {
      body = { role: "customer", username: document.getElementById("custUsername").value, password: document.getElementById("custPass").value };
    }

    const res = await fetch(API + "/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      err.textContent = data.message || "Invalid credentials";
      return;
    }

    sessionStorage.setItem("user", JSON.stringify(data.user));
    const pages = { admin: "admin.html", owner: "owner.html", customer: "customer.html" };
    window.location.href = pages[currentRole];

  } catch (e) {
    err.textContent = "Cannot connect to server. Make sure server is running.";
  } finally {
    btn.disabled = false;
  }
}

async function doRegister() {
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("errorMsg");
  btn.disabled = true;
  err.textContent = "";
  err.classList.remove("success");

  try {
    let endpoint = "";
    let body = {};
    if (currentRole === "customer") {
      endpoint = "/register/customer";
      body = {
        username: document.getElementById("signupCustUsername").value,
        email: document.getElementById("signupCustEmail").value,
        password: document.getElementById("signupCustPass").value,
        confirmPassword: document.getElementById("signupCustConfirm").value,
        phone_number: document.getElementById("signupCustPhone").value,
        address: document.getElementById("signupCustAddress").value,
        bio: document.getElementById("signupCustBio").value
      };
    } else if (currentRole === "owner") {
      endpoint = "/register/owner";
      body = {
        username: document.getElementById("signupOwnerUsername").value,
        email: document.getElementById("signupOwnerEmail").value,
        phone_number: document.getElementById("signupOwnerPhone").value,
        store_name: document.getElementById("signupStoreName").value,
        password: document.getElementById("signupOwnerPass").value,
        confirmPassword: document.getElementById("signupOwnerConfirm").value
      };
    } else {
      err.textContent = "Admin accounts cannot be created here.";
      return;
    }

    const res = await fetch(API + endpoint, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok || !data.success) {
      err.textContent = data.message || "Could not create account";
      return;
    }

    err.textContent = data.message || "Account created. You can log in now.";
    err.classList.add("success");
    setTimeout(() => {
      authMode = "login";
      document.querySelector('[data-role="admin"]').style.display = "block";
      document.getElementById("switchText").textContent = "Need an account?";
      document.getElementById("switchBtn").textContent = "Sign Up";
      selectRole(currentRole);
    }, 900);
  } catch (e) {
    err.textContent = "Cannot connect to server. Make sure server is running.";
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
